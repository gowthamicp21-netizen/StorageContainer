spring.application.name=StorageContainer

# ---------------------------------------------------------------------------
# Local, untracked configuration.
#
# Secrets and machine-specific paths belong in application-local.properties,
# which is gitignored. Both candidate locations are probed because an IDE run
# and `mvn` can use different working directories. `optional:` means a missing
# file is not fatal, so a fresh clone or a deploy that supplies real environment
# variables still starts.
# ---------------------------------------------------------------------------
spring.config.import=optional:file:./application-local.properties,optional:file:../application-local.properties


spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/StorageContainer}
spring.datasource.username=${DB_USERNAME:postgres}
# No default on purpose: a loud startup failure beats connecting with a blank
# password, and an empty value here would be silently accepted by PostgreSQL
# in some configurations.
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


server.port=${SERVER_PORT:8080}


# The client id is not a secret: an OAuth client id is handed to the browser by
# design. Only the client secret has to stay private.
spring.security.oauth2.client.registration.google.client-id=908928381699-48bpaphpmhkgk37k2itsa7vb9329ji9d.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

spring.security.oauth2.client.registration.google.scope=openid,profile,email


# Blobs live on the local disk, one directory per user id.
# Forward slashes are mandatory in any committed value here: a .properties file
# treats "\" as an escape, so C:\Users\name\uploads silently becomes
# C:Usersnameuploads and resolves against the JVM working directory.
# The default is relative, so the repository never records a developer's home path.
file.upload-dir=${UPLOAD_DIR:uploads}

# Spring's built-in 1 MB default otherwise rejects most real documents.
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:100MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:100MB}


# JWT signing key: base64 of at least 32 random bytes.
# Generate one with:  openssl rand -base64 32
# The application refuses to start without it, so tokens survive restarts.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiry-minutes=${JWT_EXPIRY_MINUTES:30}


# One-time password reset links.
app.auth.reset-link-base-url=${RESET_LINK_BASE_URL:http://localhost:5173/reset-password}
app.auth.reset-token-ttl-minutes=15
app.auth.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}


# SMTP used to deliver reset links. Left unset, reset requests fail with 503
# rather than silently dropping the email.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.auth.reset-email-from=${RESET_EMAIL_FROM:noreply@storagecontainer.local}
